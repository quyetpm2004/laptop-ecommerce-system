services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laptopshop}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_net

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      DB_PORT: 3306
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-laptopshop}
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE:-laptopshop}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:4173"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - app_net

volumes:
  db_data:

networks:
  app_net:
